<title>HMI Copilot Architecture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an app frame. A header with three views; each view is a pannable board of nested boxes with a step player, or a scrolling journey. Palette: black and white with neutral greys, and one light green for whatever is active. */
:root{
  --bg:#f5f5f5; --stage:#ffffff; --panel:#ffffff; --panel2:#f0f0f0; --ink:#0a0a0a; --muted:#5c5c5c;
  --line:#d0d0d0; --line2:#e6e6e6; --edge:#9a9a9a; --grid:#f0f0f0;
  --accent:#4ade80; --flow:#4ade80; --flow-soft:#4ade801f; --warn:#5c5c5c; --warn-soft:#f4f4f4;
  --k-client:#5c5c5c; --k-ui:#5c5c5c; --k-api:#5c5c5c; --k-core:#5c5c5c; --k-ai:#5c5c5c;
  --k-data:#5c5c5c; --k-rt:#5c5c5c; --k-compute:#5c5c5c; --k-se:#5c5c5c; --k-note:#5c5c5c;
  --f-display:"Inter", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --shadow:none;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --stage:#0a0a0a; --panel:#141414; --panel2:#1c1c1c; --ink:#fafafa; --muted:#a3a3a3;
  --line:#2e2e2e; --line2:#202020; --edge:#555555; --grid:#121212;
  --accent:#4ade80; --flow:#4ade80; --flow-soft:#4ade8026; --warn:#a3a3a3; --warn-soft:#161616;
  --k-client:#a3a3a3; --k-ui:#a3a3a3; --k-api:#a3a3a3; --k-core:#a3a3a3; --k-ai:#a3a3a3;
  --k-data:#a3a3a3; --k-rt:#a3a3a3; --k-compute:#a3a3a3; --k-se:#a3a3a3; --k-note:#a3a3a3;
  --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#000000; --stage:#0a0a0a; --panel:#141414; --panel2:#1c1c1c; --ink:#fafafa; --muted:#a3a3a3;
  --line:#2e2e2e; --line2:#202020; --edge:#555555; --grid:#121212;
  --accent:#4ade80; --flow:#4ade80; --flow-soft:#4ade8026; --warn:#a3a3a3; --warn-soft:#161616;
  --k-client:#a3a3a3; --k-ui:#a3a3a3; --k-api:#a3a3a3; --k-core:#a3a3a3; --k-ai:#a3a3a3;
  --k-data:#a3a3a3; --k-rt:#a3a3a3; --k-compute:#a3a3a3; --k-se:#a3a3a3; --k-note:#a3a3a3;
  --shadow:none; color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;min-height:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--flow);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line2)}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.02em}
.tabs{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:3px}
.tabs a{font-family:var(--f-body);font-weight:500;font-size:13px;text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:6px}
.tabs a[aria-current="page"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.top .spacer{flex:1}
.hint{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ibtn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 10px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ibtn:hover{border-color:var(--muted)}
.ibtn[aria-pressed="true"]{border-color:var(--flow);color:var(--flow)}

/* views */
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toolbar{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--edge)}
.chip[aria-pressed="true"]{border-color:var(--flow);background:var(--flow-soft)}
.chip[aria-pressed="true"] i{background:var(--flow)}
.find{flex:none;margin-left:auto;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 10px;font:12.5px var(--f-body);color:var(--ink);width:170px}

/* stage + world */
.stage{position:relative;flex:1;min-height:300px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--stage);touch-action:none;cursor:grab}
.stage.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;text-rendering:geometricPrecision;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:48px 48px}
.world.cam{transition:transform .75s cubic-bezier(.2,.7,.2,1)}
.node{position:absolute;box-sizing:border-box;--kc:var(--k-core)}
.k-client{--kc:var(--k-client)} .k-ui{--kc:var(--k-ui)} .k-api{--kc:var(--k-api)} .k-core{--kc:var(--k-core)} .k-ai{--kc:var(--k-ai)}
.k-data{--kc:var(--k-data)} .k-rt{--kc:var(--k-rt)} .k-compute{--kc:var(--k-compute)} .k-se{--kc:var(--k-se)} .k-note{--kc:var(--k-note)}
.grp{border:1px dashed color-mix(in srgb,var(--kc) 50%,var(--line));border-radius:12px;background:color-mix(in srgb,var(--kc) 5%,transparent);z-index:1;transition:opacity .4s,border-color .3s,background .3s}
.grp .gl{position:absolute;left:14px;top:10px;right:14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-family:var(--f-mono);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--kc);font-weight:500}
.grp .gl small{font-size:11px;text-transform:none;letter-spacing:0;color:var(--muted);font-weight:400}
.box{z-index:3;background:var(--panel);border:1.5px solid var(--line);border-radius:7px;padding:8px 10px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;cursor:pointer;transition:opacity .4s,border-color .3s,box-shadow .3s,transform .3s}
.box:hover{border-color:var(--kc)}
.nk{display:flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--kc)}
.nk i{width:6px;height:6px;background:var(--kc);border-radius:1px}
.nt{font-family:var(--f-display);font-weight:600;font-size:14.5px;line-height:1.15;letter-spacing:-.005em;text-wrap:balance}
.ns{font-size:11.5px;color:var(--muted);line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.box.sm .nk{display:none}
.box.sm{justify-content:center}
.box.k-note{background:var(--warn-soft);border-style:dashed;border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.box.k-note .nt{font-size:13.5px}
.box.big .nt{font-size:17px}
.box.sel{border-color:var(--kc);box-shadow:0 0 0 3px color-mix(in srgb,var(--kc) 28%,transparent)}
.flowing .box:not(.on):not(.seen){opacity:.6}
.flowing .grp:not(.on):not(.seen):not(.ctx){opacity:.8}
.flowing .box.seen{opacity:.9}
.box.on{border-color:var(--flow);box-shadow:0 0 0 3px var(--flow-soft),var(--shadow)}
.grp.on{border-color:var(--flow);border-style:solid;background:color-mix(in srgb,var(--flow) 8%,transparent)}
.grp.on .gl{color:var(--flow)}
.node.hit::after{content:"";position:absolute;inset:-2px;border-radius:inherit;border:2px solid var(--flow);animation:hit 1.1s ease-out 1;pointer-events:none}
@keyframes hit{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.08)}}
.dim{opacity:.4!important}
.match{border-color:var(--flow)!important}

svg.edges{position:absolute;left:0;top:0;z-index:2;overflow:visible;pointer-events:none}
svg.top{z-index:4}
.edge{fill:none;stroke:var(--edge);stroke-width:1.4;opacity:.7;transition:opacity .35s,stroke .35s}
.flowing .edge{opacity:.22}
.edge.trail{opacity:.75;stroke:var(--muted);stroke-width:1.6}
.edge.hov{opacity:1;stroke:var(--muted);stroke-width:1.8}
.edge.on{opacity:1;stroke:var(--flow);stroke-width:2.6;stroke-dasharray:8 6;animation:ants .8s linear infinite}
@keyframes ants{to{stroke-dashoffset:-14}}
.mk-base{fill:var(--edge)} .mk-trail{fill:var(--muted)} .mk-on{fill:var(--flow)}
.lab{opacity:0;transition:opacity .3s}
.lab.show{opacity:1}
.lab rect{fill:var(--panel);stroke:var(--line)}
.lab.onl rect{stroke:var(--flow)}
.lab text{font-family:var(--f-mono);font-size:11px;fill:var(--ink)}
.pk{fill:var(--flow);stroke:var(--stage);stroke-width:2} .pkh{display:none}

.ctrls{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));bottom:10px;z-index:6;display:flex;flex-direction:column;gap:4px}
.ctrls button{width:32px;height:32px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer;font-family:var(--f-mono);font-size:15px;display:grid;place-items:center}
.ctrls button:hover{border-color:var(--muted)}
.legend{position:absolute;left:10px;bottom:10px;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;grid-template-columns:repeat(2,auto);gap:3px 14px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);max-width:calc(100% - 70px)}
.legend span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{width:8px;height:8px;border-radius:2px;background:var(--kc)}
.legend.min{grid-template-columns:auto}
.legend.min span:not(:first-child){display:none}
.lg-t{cursor:pointer;color:var(--ink)}

/* player */
.player{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.pl-btns{display:flex;gap:4px}
.pl-btns button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;display:grid;place-items:center}
.pl-btns button.play{background:var(--flow);border-color:var(--flow);color:#0a0a0a}
.pl-btns svg{width:15px;height:15px;fill:currentColor}
.pl-text{min-width:0;display:flex;flex-direction:column;gap:2px}
.pl-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pl-meta b{color:var(--flow);font-weight:500}
.pl-title{font-family:var(--f-display);font-weight:700;font-size:16.5px;letter-spacing:-.01em}
.pl-cap{font-size:13.5px;color:var(--ink);max-width:95ch;text-wrap:pretty}
.pl-cap code,.dr code,.jr code{font-family:var(--f-mono);font-size:.88em;background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:0 4px}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.dots button{width:18px;height:6px;border-radius:3px;border:0;background:var(--line);cursor:pointer;padding:0}
.dots button.done{background:color-mix(in srgb,var(--flow) 45%,var(--line))}
.dots button.cur{background:var(--flow);width:28px}
.prog{height:2px;background:var(--line2);border-radius:2px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;width:0;background:var(--flow)}

/* drawer */
.drawer{position:fixed;z-index:20;top:calc(70px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));width:min(380px,calc(100% - 32px));max-height:calc(100% - 100px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px #0000002a;padding:16px 18px;--kc:var(--k-core)}
.dr-k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--kc);display:flex;align-items:center;gap:6px}
.dr-k i{width:7px;height:7px;background:var(--kc);border-radius:2px}
.dr h3{font-family:var(--f-display);font-size:20px;margin:6px 0 2px;letter-spacing:-.01em;text-wrap:balance}
.dr .sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.dr p{margin:0 0 12px;font-size:13.5px}
.dr h4{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-weight:500}
.dr ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.dr li button{all:unset;cursor:pointer;display:flex;gap:8px;font-size:12.5px;align-items:baseline;padding:3px 0}
.dr li button:hover .to{color:var(--flow)}
.dr li .dir{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:14px}
.dr li .to{font-weight:500}
.dr li .el{color:var(--muted)}
.dr .files{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);word-break:break-word}
.dr .x{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}

/* LLD */
.lldwrap{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px}
.lldlist{display:flex;flex-direction:column;gap:4px;overflow:auto;min-height:0}
.lldlist button{all:unset;cursor:pointer;border:1px solid transparent;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:1px}
.lldlist button:hover{background:var(--panel2)}
.lldlist button[aria-current="true"]{background:var(--panel);border-color:var(--line);box-shadow:var(--shadow)}
.lldlist .n{font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.06em}
.lldlist b{font-family:var(--f-display);font-weight:500;font-size:14px}
.lldlist span{font-size:11.5px;color:var(--muted)}
.lldmain{min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}
.lldhead{display:flex;flex-direction:column;gap:2px}
.lldhead h2{margin:0;font-family:var(--f-display);font-size:21px;letter-spacing:-.01em}
.lldhead p{margin:0;color:var(--muted);font-size:13px;max-width:100ch}
.lldhead .files{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.lldhost{flex:1;min-height:0;display:flex}
.lldhost>.stage{flex:1}

/* journey */
#v-journey{overflow:auto}
.jr{max-width:1180px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:34px;padding-bottom:40px}
.jr h2{font-family:var(--f-display);font-size:26px;letter-spacing:-.015em;margin:0 0 4px;text-wrap:balance}
.jr .lede{color:var(--muted);margin:0 0 14px;max-width:75ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.stats div{background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:1px}
.stats b{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stats span{font-size:12px;color:var(--muted)}
.tl{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:28px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--line),var(--flow))}
.ph{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 18px;animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.ph::before{content:"";position:absolute;left:-25px;top:18px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--muted)}
.ph.now::before{background:var(--flow);border-color:var(--flow);box-shadow:0 0 0 5px var(--flow-soft)}
.ph .d{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ph .d b{display:block;color:var(--ink);font-family:var(--f-display);font-size:16px;font-weight:700;margin-top:2px}
.ph ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.ph .m{grid-column:2;font-family:var(--f-mono);font-size:11.5px;color:var(--accent);margin-top:6px}
@keyframes rise{from{transform:translateY(10px);opacity:.35}to{transform:none;opacity:1}}
.mx-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table.mx{border-collapse:collapse;width:100%;min-width:860px;font-size:12.5px}
.mx th,.mx td{padding:6px 8px;border-bottom:1px solid var(--line2);text-align:center}
.mx th{font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.03em;cursor:pointer}
.mx td:first-child,.mx th:first-child{text-align:left;position:sticky;left:0;background:var(--panel);min-width:230px}
.mx .c{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle}
.mx .c1{background:var(--accent)} .mx .cb{background:transparent;border:2px solid var(--accent)} .mx .cx{background:transparent;border:2px solid var(--warn);position:relative}
.mx .cx::after{content:"";position:absolute;left:-2px;right:-2px;top:5px;height:2px;background:var(--warn);transform:rotate(-35deg)}
.mx col.hl,.mx td.hl,.mx th.hl{background:var(--flow-soft)}
.mx td:first-child.hl{background:var(--panel)}
.mx-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:12.5px;color:var(--muted)}
.mx-bar .key{display:flex;gap:12px;flex-wrap:wrap}
.mx-bar .key span{display:inline-flex;gap:6px;align-items:center}
.dec{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.dc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.dc .when{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.dc h3{margin:0;font-family:var(--f-display);font-size:16px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.ba{display:grid;grid-template-columns:minmax(0,1fr) 18px minmax(0,1fr);gap:6px;align-items:stretch;font-size:12.5px}
.ba div{border-radius:7px;padding:7px 9px}
.ba .b{background:var(--panel2);color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--warn) 70%,transparent)}
.ba .a{background:var(--flow-soft);color:var(--ink)}
.ba .ar{display:grid;place-items:center;color:var(--muted);padding:0}
.dc p{margin:0;font-size:12.5px;color:var(--muted)}
.now2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.now2 .col{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.now2 h3{margin:0 0 8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.now2 .ok h3{color:var(--accent)} .now2 .open h3{color:var(--warn)}
.now2 ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13px}

@media (max-width:820px){
  .lldwrap{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .lldlist{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .lldlist button{flex:none;width:170px}
  .lldlist span{display:none}
  .ph{grid-template-columns:minmax(0,1fr)}
  .ph .m{grid-column:1}
  .top .hint{display:none}
  .find{width:130px}
}
@media (max-width:560px){
  .player{grid-template-columns:minmax(0,1fr)}
  .drawer{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-height:55%}
  .legend{display:none}
  .pl-cap{font-size:13px}
}

flows:[
{id:"tour",t:"Overview tour",steps:[
 {t:"Five zones",c:"People on the left. One Vercel deployment in the middle. Paid-for services on the right. Schneider's own files at the bottom left, as the ground truth everything is checked against.",n:["z_people","z_vercel","z_ai_ext","z_mongo","z_supa","z_sbx","z_se"],fit:1},
 {t:"Who works with it",c:"An engineer in the browser, Claude in claude.ai through our connector, and a terminal for the same code. All three go through the same write path.",n:["z_people","eng","claude","cli"]},
 {t:"The web app",c:"Workspace, inspector, a Copilot column with Chat, Agent and MCP, plus tags, validation, simulate and export. The renderer draws from the same JSON the packager writes.",n:["z_ui"]},
 {t:"61 route handlers",c:"Thin adapters. They check access, then call lib/. Generation and the agent stream; projects/[id] carries co-editing; mcp and oauth serve claude.ai.",n:["z_api"]},
 {t:"Domain core",c:"All logic lives in lib/. <code>core/ops</code> is the only write path: 26 ops, checked with zod, used by chat, inspector, connector and co-editing alike.",n:["z_core","d_ops"]},
 {t:"The file boundary",c:"ote/ reads and writes EcoStruxure's own .eote. Untouched entries go back byte-identical; Compound Objects are drawn from their definitions; preflight refuses what OTE would refuse.",n:["z_ote"]},
 {t:"Three AI paths",c:"ai/ plans screens and runs the chat loop. agent/ edits the raw file with 30 tools. mcp/ exposes 29 tools to Claude, starting with a guide. A model proposes; code checks; a person accepts.",n:["z_ai","z_agent","z_mcp"]},
 {t:"Data and sync",c:"MongoDB holds every byte of project data, including binaries in GridFS. Supabase is used for one thing only: Realtime hints, because Vercel cut SSE streams at 60 s.",n:["z_mongo","z_supa"]},
 {t:"Models",c:"Gemini today, Claude through the same seam. The free-tier quota is the one hard limit for a live demo.",n:["z_ai_ext","quota"]},
 {t:"Ground truth",c:"A licensed OTE 4.4 opens and simulates what we write. Part types, graphics and the skeleton come from the install and are never committed.",n:["z_se"]},
]},
{id:"gen",t:"Tags → .eote",steps:[
 {t:"A tag export comes in",c:"The engineer drops a PLC export: CSV, XML, Control Expert .xvm or Machine Expert symbols.",e:["e1"]},
 {t:"Parsed and corrected, in the open",c:"Names that break OTE's rules are corrected and listed. The sample plant: 1,248 tags, five corrections, all reported.",e:["e2","e3","g3"]},
 {t:"One sentence starts the pipeline",c:"A sentence or a confirmed plant brief starts the eight streamed steps.",e:["e4","e5"]},
 {t:"Equipment, then a plan",c:"Tag names become equipment. The model plans screens as JSON and picks among real parts. It never does geometry.",e:["e6","e7"]},
 {t:"Layout and validation",c:"Every screen gets the same header, nav strip and alarm banner (ISA-101). Validation runs before anything is shown as done.",e:["e8","e9"]},
 {t:"Streamed to the canvas",c:"Events arrive over SSE, one complete object at a time, with lines like <code>Parsed 1,248 tags</code>, never <code>Thinking…</code>.",e:["e10"]},
 {t:"Packaged in the product's own format",c:"The packager wraps a skeleton extracted from a licensed install, read from GridFS.",e:["e11","e12","e15","e13","g1"]},
 {t:"It opens in OTE 4.4",c:"File → Open Project. Screens, variables, alarms and bindings are there. Nothing to import or assemble.",e:["e14"]},
]},
{id:"chat",t:"Chat edit",steps:[
 {t:"A request in words",c:"<code>make the pump 2 fault lamp red</code>. The client sends the message with the current document.",e:["c1"]},
 {t:"A tool loop on the server",c:"Gemini 3.8 Flash with forced function calling: look things up, read the screen, try ops.",e:["c2","c3"]},
 {t:"Ops tried on a draft",c:"try_ops applies ops to a copy. The real project is untouched until the engineer sees the result.",e:["c4"]},
 {t:"The model looks at its work",c:"render_screen sends a PNG back to the model; validate runs the rules on the draft.",e:["c5","c6"]},
 {t:"Applied as one undo",c:"The client applies the ops through applyOps. One turn is one undo step.",e:["c7"]},
 {t:"Committed with a revision",c:"The batch goes to /changes. A Mongo transaction assigns the revision and writes the op log.",e:["c8","c9","c10","c13","c14"]},
 {t:"Everyone else sees it",c:"A small Realtime hint goes out; other replicas fetch the ops.",e:["c11","c11b","c12"]},
]},
{id:"mcp",t:"Claude over MCP",steps:[
 {t:"claude.ai signs in",c:"Our own OAuth server: discovery, dynamic registration, authorize, token with PKCE, against the same accounts.",e:["m1","m10"]},
 {t:"A tool call",c:"Claude reads the guide first, then calls <code>/api/mcp</code> over Streamable HTTP. 29 tools read, write and manage projects; match_tags turns the engineer's words into tags.",e:["m2","m3","m11"]},
 {t:"Writes become proposals",c:"Unless direct writes are on, a write is stored as a proposal with via: mcp. A proposal can build on one still waiting; it is accepted after it. A refused call goes to the gap log.",e:["m4","m5","m12"]},
 {t:"The engineer is told",c:"A Realtime hint puts it in the MCP tab's queue.",e:["m6"]},
 {t:"Reviewed, then accepted",c:"The review shows now beside after and every op. Accept sends it through the normal change path.",e:["m7","m8"]},
 {t:"Claude sees the screen",c:"render_screen returns an MCP Apps card in the chat.",e:["m9"]},
]},
{id:"agent",t:"Agent on the file",steps:[
 {t:"A job in words",c:"For example: add a push button made like the engineer's START, bound to AUTOSTART the way START is bound to Run_CMD.",e:["a1"]},
 {t:"The .eote opens in memory",c:"Entry names, BOMs and order kept. DriverConfig.db, the PLC connection, is hidden.",e:["a2"]},
 {t:"The loop picks tools",c:"Claude or Gemini choose among 30 tools, step by step, every step shown live.",e:["a3","a4","a4b","a10"]},
 {t:"Scripts and a real shell",c:"run_script in QuickJS, or bash in a Vercel Sandbox that can reach only pypi and npm.",e:["a5","a6","a7","a11"]},
 {t:"It checks its own work",c:"check: JSON, duplicate ids, dangling bindings, screen numbers, the screen tree, preflight and a full repackage.",e:["a8"]},
 {t:"Saved as a new file",c:"The opened file is never changed. The result is a new source; one click puts back what was open.",e:["a9"]},
]},
{id:"open",t:"Open an existing project",steps:[
 {t:"Upload in chunks",c:"Brownfield is the market, so the reader came before more writing. Parts are stored as bytes.",e:["b1","b7"]},
 {t:"Checked before trusted",c:"ingest sniffs what the file really is and unzips it safely.",e:["b2"]},
 {t:"Read without loss",c:"Unknown fields survive. Fields lost on the corpus went from 7,500+ to 0.",e:["b3"]},
 {t:"The engineer's own objects",c:"Compound Objects are drawn from their definitions; the project's conventions feed the knowledge store.",e:["b4","b5","b6"]},
]},
{id:"sync",t:"Live co-editing",steps:[
 {t:"Engineer A edits",c:"Every edit is a batch of ops with change ids, so a retry is safe.",e:["c8"]},
 {t:"The server decides",c:"A Mongo transaction checks retries with one $in query, assigns the revision and writes the log.",e:["c9","c10"]},
 {t:"A hint, not the data",c:"Broadcast carries project, revision and author. Non-members cannot join the private channel.",e:["c11","c11b","r1","r2"]},
 {t:"Others catch up",c:"A replica that sees a gap fetches the ops from the API.",e:["c12"]},
]},
]};

/* ====================== BOARD ENGINE ====================== */
function geom(a,b){
  const ox=a.x<b.x+b.w&&b.x<a.x+a.w, oy=a.y<b.y+b.h&&b.y<a.y+a.h;
  let p0,p3,c1,c2;
  if(ox&&!oy){
    const dn=b.y>a.y;
    p0={x:a.x+a.w/2,y:dn?a.y+a.h:a.y}; p3={x:b.x+b.w/2,y:dn?b.y:b.y+b.h};
    const k=Math.max(30,Math.abs(p3.y-p0.y)*.5);
    c1={x:p0.x,y:p0.y+(dn?k:-k)}; c2={x:p3.x,y:p3.y-(dn?k:-k)};
  }else{
    const rt=(b.x+b.w/2)>(a.x+a.w/2);
    p0={x:rt?a.x+a.w:a.x,y:a.y+a.h/2}; p3={x:rt?b.x:b.x+b.w,y:b.y+b.h/2};
    const k=Math.max(40,Math.abs(p3.x-p0.x)*.45);
    c1={x:p0.x+(rt?k:-k),y:p0.y}; c2={x:p3.x-(rt?k:-k),y:p3.y};
  }
  return{p0,c1,c2,p3};
}
function bez(g,t){const u=1-t,a=u*u*u,b=3*u*u*t,c=3*u*t*t,d=t*t*t;return{x:a*g.p0.x+b*g.c1.x+c*g.c2.x+d*g.p3.x,y:a*g.p0.y+b*g.c1.y+c*g.c2.y+d*g.p3.y}}
let BID=0;
class Board{
  constructor(host,spec,opt){
    this.host=host;this.spec=spec;this.opt=opt||{};this.id="b"+(++BID);
    this.nodes=new Map(spec.nodes.map(n=>[n.i,n]));
    this.cam={x:0,y:0,s:1};this.packets=[];this.raf=0;this.sel=null;
    this.build();this.bindInput();
    new ResizeObserver(()=>{const w=this.host.offsetWidth,hh=this.host.offsetHeight;if(!w||(w===this.lw&&hh===this.lh))return;
      if(!this.userMoved)this.fit(false);else{this.lw=w;this.lh=hh}}).observe(host);
  }
  build(){
    const {W,H}=this.spec,h=this.host;h.innerHTML="";h.classList.add("stage");
    const w=this.world=el("div","world");w.style.width=W+"px";w.style.height=H+"px";
    // after a camera move, drop the transition and set the transform again so text is redrawn sharp at the final zoom
    w.addEventListener("transitionend",e=>{if(e.target!==w)return;w.classList.remove("cam");const t=w.style.transform;w.style.transform="none";void w.offsetWidth;w.style.transform=t});
    this.els=new Map();
    const mk=n=>{
      const d=el("div","node "+(n.g?"grp":"box")+" k-"+n.k);
      Object.assign(d.style,{left:n.x+"px",top:n.y+"px",width:n.w+"px",height:n.h+"px"});
      d.dataset.id=n.i;
      if(n.g){d.innerHTML=`<div class="gl"><span>${n.t}</span>${n.s?`<small>${n.s}</small>`:""}</div>`}
      else{
        if(n.h<72)d.classList.add("sm");if(n.big)d.classList.add("big");
        d.innerHTML=`<div class="nk"><i></i>${KIND[n.k]||""}</div><div class="nt">${n.t}</div>${n.s?`<div class="ns">${n.s}</div>`:""}`;
        d.tabIndex=0;d.setAttribute("role","button");
      }
      this.els.set(n.i,d);return d;
    };
    this.spec.nodes.filter(n=>n.g).forEach(n=>w.append(mk(n)));
    const svg=this.svg=sv("svg",{class:"edges",width:W,height:H,viewBox:`0 0 ${W} ${H}`});
    const defs=sv("defs",{});
    for(const s of["base","trail","on"]){const m=sv("marker",{id:`${this.id}-${s}`,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse",markerUnits:"userSpaceOnUse"});m.setAttribute("markerWidth",s==="on"?"11":"8");m.setAttribute("markerHeight",s==="on"?"11":"8");m.append(sv("path",{d:"M0,0 L10,5 L0,10 z",class:"mk-"+s}));defs.append(m)}
    svg.append(defs);
    this.edges=new Map();
    const lay=sv("g",{});svg.append(lay);
    // labels and packets go in a top svg so leaves never hide them
    const top=this.top=sv("svg",{class:"edges top",width:W,height:H,viewBox:`0 0 ${W} ${H}`});
    const labs=sv("g",{});this.pkLayer=sv("g",{});top.append(labs,this.pkLayer);
    for(const [id,a,b,l] of this.spec.edges){
      const A=this.nodes.get(a),B=this.nodes.get(b);if(!A||!B)continue;
      const g=geom(A,B);
      const p=sv("path",{d:`M${g.p0.x},${g.p0.y} C${g.c1.x},${g.c1.y} ${g.c2.x},${g.c2.y} ${g.p3.x},${g.p3.y}`,class:"edge","marker-end":`url(#${this.id}-base)`});
      lay.append(p);
      let lab=null;
      if(l){const m=bez(g,.5),tw=l.length*6.7+14;lab=sv("g",{class:"lab",transform:`translate(${m.x},${m.y})`});
        lab.append(sv("rect",{x:-tw/2,y:-10,width:tw,height:20,rx:5}));const tx=sv("text",{x:0,y:4,"text-anchor":"middle"});tx.textContent=l;lab.append(tx);labs.append(lab)}
      this.edges.set(id,{id,a,b,l,g,p,lab});
    }
    w.append(svg);
    this.spec.nodes.filter(n=>!n.g).forEach(n=>w.append(mk(n)));
    w.append(top);
    h.append(w);
    const c=el("div","ctrls");
    c.innerHTML=`<button data-z="in" aria-label="Zoom in">+</button><button data-z="out" aria-label="Zoom out">−</button><button data-z="fit" aria-label="Fit to screen">⤢</button>`;
    c.addEventListener("click",e=>{const z=e.target.closest("button")?.dataset.z;if(!z)return;const r=h.getBoundingClientRect();
      if(z==="fit")this.fit(true);else this.zoomAt(r.left+r.width/2,r.top+r.height/2,z==="in"?1.25:.8,true)});
    h.append(c);
    if(this.opt.legend){const lg=el("div","legend");const ks=["client","ui","api","core","ai","data","rt","compute","se","note"];
      lg.innerHTML=`<span class="lg-t">Legend ▾</span><span></span>`+ks.map(k=>`<span class="k-${k}"><i></i>${KIND[k]}</span>`).join("");
      lg.querySelector(".lg-t").addEventListener("click",()=>lg.classList.toggle("min"));h.append(lg);
      if(innerWidth<900)lg.classList.add("min")}
  }
  apply(anim){this.lw=this.host.offsetWidth;this.lh=this.host.offsetHeight;const w=this.world;w.classList.toggle("cam",!!anim&&!REDUCE);w.style.transform=`translate(${this.cam.x}px,${this.cam.y}px) scale(${this.cam.s})`}
  fitScale(){const r=this.host.getBoundingClientRect();return Math.min((r.width-24)/this.spec.W,(r.height-24)/this.spec.H)}
  fit(anim){const r=this.host.getBoundingClientRect();if(!r.width)return;const s=this.fitScale();
    this.cam={s,x:(r.width-this.spec.W*s)/2,y:(r.height-this.spec.H*s)/2};this.userMoved=false;this.apply(anim)}
  focus(ids,anim){
    const r=this.host.getBoundingClientRect();if(!r.width||!ids.length)return;
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(const i of ids){const n=this.nodes.get(i);if(!n)continue;x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+n.w);y1=Math.max(y1,n.y+n.h)}
    const pad=60,fs=this.fitScale();
    let s=Math.min((r.width-pad*2)/(x1-x0),(r.height-pad*2)/(y1-y0),1.15);s=Math.max(s,fs);
    this.cam={s,x:r.width/2-(x0+x1)/2*s,y:r.height/2-(y0+y1)/2*s};this.apply(anim);
  }
  zoomAt(cx,cy,f,anim){const r=this.host.getBoundingClientRect(),px=cx-r.left,py=cy-r.top,c=this.cam;
    const s=Math.min(2.6,Math.max(this.fitScale()*.6,c.s*f));const k=s/c.s;
    this.cam={s,x:px-(px-c.x)*k,y:py-(py-c.y)*k};this.userMoved=true;this.apply(anim)}
  bindInput(){
    const h=this.host,pts=new Map();let moved=0,downNode=null,last=null,pinch=null;
    h.addEventListener("pointerdown",e=>{if(e.target.closest(".ctrls,.legend"))return;
      pts.set(e.pointerId,{x:e.clientX,y:e.clientY});h.setPointerCapture(e.pointerId);
      if(pts.size===1){moved=0;downNode=e.target.closest(".box");last={x:e.clientX,y:e.clientY}}
      if(pts.size===2){const [p,q]=[...pts.values()];pinch={d:Math.hypot(p.x-q.x,p.y-q.y)}}
      this.world.classList.remove("cam")});
    h.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pts.size===1&&last){const dx=e.clientX-last.x,dy=e.clientY-last.y;moved+=Math.abs(dx)+Math.abs(dy);last={x:e.clientX,y:e.clientY};
        if(moved>5){h.classList.add("drag");this.cam.x+=dx;this.cam.y+=dy;this.userMoved=true;this.apply(false)}}
      else if(pts.size===2&&pinch){const [p,q]=[...pts.values()];const d=Math.hypot(p.x-q.x,p.y-q.y);moved=99;
        this.zoomAt((p.x+q.x)/2,(p.y+q.y)/2,d/pinch.d,false);pinch.d=d}});
    const up=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);h.classList.remove("drag");

    h.addEventListener("keydown",e=>{const b=e.target.closest?.(".box");if(b&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.stopPropagation();this.select(b.dataset.id)}});
    h.addEventListener("pointerover",e=>{const b=e.target.closest(".box");if(b)this.hover(b.dataset.id,true)});
    h.addEventListener("pointerout",e=>{const b=e.target.closest(".box");if(b)this.hover(b.dataset.id,false)});
  }
  hover(id,on){for(const E of this.edges.values()){if(E.a===id||E.b===id||(this.sel&&(E.a===this.sel||E.b===this.sel)&&!on&&false)){
    if(on){E.p.classList.add("hov");E.lab&&E.lab.classList.add("show")}else if(!(this.sel&&(E.a===this.sel||E.b===this.sel))){E.p.classList.remove("hov");if(E.lab&&!E.p.classList.contains("on")&&!E.p.classList.contains("trail"))E.lab.classList.remove("show")}}}}

    if(id){this.sel=id;this.els.get(id)?.classList.add("sel");this.hover(id,true)}
    this.opt.onSelect&&this.opt.onSelect(id?this.nodes.get(id):null,this);
  }
  links(id){const out=[];for(const E of this.edges.values()){if(E.a===id)out.push({dir:"→",other:E.b,l:E.l});else if(E.b===id)out.push({dir:"←",other:E.a,l:E.l})}return out}
  setEdge(E,state){E.p.classList.remove("on","trail");if(state)E.p.classList.add(state);E.p.setAttribute("marker-end",`url(#${this.id}-${state||"base"})`);
    if(E.lab){E.lab.classList.toggle("show",!!state);E.lab.classList.toggle("onl",state==="on")}}
  clear(){this.host.classList.remove("flowing");for(const E of this.edges.values())this.setEdge(E,null);
    for(const d of this.els.values())d.classList.remove("on","seen","hit","ctx");this.stopPackets()}
  stepIds(st){const s=new Set(st.n||[]);for(const id of st.e||[]){const E=this.edges.get(id);if(E){s.add(E.a);s.add(E.b)}}return[...s]}
  show(steps,i,follow){
    this.clear();if(i<0)return;this.host.classList.add("flowing");
    for(let j=0;j<i;j++){for(const id of steps[j].e||[]){const E=this.edges.get(id);E&&this.setEdge(E,"trail")}for(const n of this.stepIds(steps[j]))this.els.get(n)?.classList.add("seen")}
    const st=steps[i],ids=this.stepIds(st);
    for(const id of st.e||[]){const E=this.edges.get(id);E&&this.setEdge(E,"on")}
    for(const n of ids){const d=this.els.get(n);if(!d)continue;d.classList.remove("seen");d.classList.add("on");void d.offsetWidth;d.classList.add("hit")}
    // keep the groups that contain active nodes readable
    for(const n of ids){const N0=this.nodes.get(n);for(const g of this.spec.nodes)if(g.g&&g.i!==n&&g.x<=N0.x&&g.y<=N0.y&&g.x+g.w>=N0.x+N0.w&&g.y+g.h>=N0.y+N0.h)this.els.get(g.i)?.classList.add("ctx")}
    this.startPackets(st.e||[]);
    if(follow){if(st.fit)this.fit(true);else this.focus(ids,true)}
  }
  startPackets(eids){this.stopPackets();if(REDUCE)return;const now=performance.now();
    eids.forEach((id,k)=>{const E=this.edges.get(id);if(!E)return;const len=Math.hypot(E.g.p3.x-E.g.p0.x,E.g.p3.y-E.g.p0.y);const dur=Math.min(2200,Math.max(900,len*2.2));
      for(let r=0;r<2;r++){const h=sv("circle",{r:11,class:"pkh"}),c=sv("circle",{r:5,class:"pk"});this.pkLayer.append(h,c);this.packets.push({E,h,c,t0:now+k*180+r*dur/2,dur})}});
    const tick=t=>{for(const p of this.packets){let u=(t-p.t0)/p.dur;if(u<0){p.c.setAttribute("opacity",0);p.h.setAttribute("opacity",0);continue}u=u%1;
      const e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2,pt=bez(p.E.g,e);for(const c of[p.c,p.h]){c.setAttribute("cx",pt.x);c.setAttribute("cy",pt.y)}
      const o=u<.08?u/.08:u>.92?(1-u)/.08:1;p.c.setAttribute("opacity",o);p.h.setAttribute("opacity",o*.22)}
      if(this.packets.length)this.raf=requestAnimationFrame(tick)};
    if(this.packets.length)this.raf=requestAnimationFrame(tick)}
  stopPackets(){cancelAnimationFrame(this.raf);for(const p of this.packets){p.c.remove();p.h.remove()}this.packets=[]}
  find(q){q=q.trim().toLowerCase();for(const [i,d] of this.els){const n=this.nodes.get(i);if(n.g)continue;
    const hit=q&&[n.t,n.s,n.d,n.f].filter(Boolean).join(" ").toLowerCase().includes(q);d.classList.toggle("match",!!hit);d.classList.toggle("dim",!!q&&!hit)}}
}

const ICON={prev:'<svg viewBox="0 0 16 16"><path d="M10.5 2.5 4.5 8l6 5.5z"/></svg>',next:'<svg viewBox="0 0 16 16"><path d="M5.5 2.5 11.5 8l-6 5.5z"/></svg>',
  play:'<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>',pause:'<svg viewBox="0 0 16 16"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/></svg>'};
class Player{
  constructor(host){this.host=host;this.i=-1;this.playing=false;this.timer=0;
    host.innerHTML=`<div class="pl-btns"><button data-a="prev" aria-label="Previous step">${ICON.prev}</button><button class="play" data-a="play" aria-label="Play">${ICON.play}</button><button data-a="next" aria-label="Next step">${ICON.next}</button></div>
    <div class="pl-text"><div class="pl-meta"></div><div class="pl-title"></div><div class="pl-cap"></div><div class="dots"></div><div class="prog"><i></i></div></div>`;
    host.addEventListener("click",e=>{const a=e.target.closest("[data-a]")?.dataset.a;if(a==="prev")this.prev();if(a==="next")this.next(true);if(a==="play")this.toggle();
      const d=e.target.closest("[data-i]");if(d){this.pause();this.go(+d.dataset.i)}});
    this.meta=host.querySelector(".pl-meta");this.title=host.querySelector(".pl-title");this.cap=host.querySelector(".pl-cap");this.dots=host.querySelector(".dots");this.bar=host.querySelector(".prog i");this.pbtn=host.querySelector(".play")}
  load(board,name,steps,auto){this.pause();this.board=board;this.name=name;this.steps=steps;
    this.dots.innerHTML=steps.map((s,i)=>`<button data-i="${i}" aria-label="Step ${i+1}: ${s.t.replace(/"/g,"")}"></button>`).join("");
    this.go(0);if(auto&&!REDUCE)this.play()}
  go(i){this.i=Math.max(0,Math.min(this.steps.length-1,i));const st=this.steps[this.i];
    this.board.show(this.steps,this.i,FOLLOW);
    this.meta.innerHTML=`<b>${this.name}</b><span>Step ${this.i+1} of ${this.steps.length}</span>`;
    this.title.textContent=st.t;this.cap.innerHTML=st.c;
    [...this.dots.children].forEach((d,k)=>{d.classList.toggle("cur",k===this.i);d.classList.toggle("done",k<this.i)});
    this.restartBar()}
  dur(){const st=this.steps[this.i];return Math.min(7000,2600+st.c.replace(/<[^>]+>/g,"").length*28)}
  restartBar(){const b=this.bar;b.style.transition="none";b.style.width="0";if(this.playing){void b.offsetWidth;b.style.transition=`width ${this.dur()}ms linear`;b.style.width="100%"}
    clearTimeout(this.timer);if(this.playing)this.timer=setTimeout(()=>this.next(false),this.dur())}
  next(user){if(user)this.pause();if(this.i<this.steps.length-1)this.go(this.i+1);else this.pause()}
  prev(){this.pause();this.go(this.i-1)}
  play(){if(this.i>=this.steps.length-1)this.i=-1;this.playing=true;this.pbtn.innerHTML=ICON.pause;this.pbtn.setAttribute("aria-label","Pause");if(this.i<0)this.go(0);else this.restartBar()}
  pause(){this.playing=false;clearTimeout(this.timer);if(this.pbtn){this.pbtn.innerHTML=ICON.play;this.pbtn.setAttribute("aria-label","Play")}if(this.bar){this.bar.style.transition="none";this.bar.style.width="0"}}
  toggle(){this.playing?this.pause():this.play()}
}

  else if(e.key==="ArrowLeft"){e.preventDefault();c.player.prev()}
  else if(e.key===" "&&!e.target.closest("button,.box")){e.preventDefault();c.player.toggle()}
  else if(e.key==="f"||e.key==="F"){c.board&&c.board.fit(true)}
  else if(e.key==="Escape"){c.board&&c.board.select(null)}
});
</script>
